<!DOCTYPE html>

<body>
<div class="bg-motif">
  <svg viewBox="0 0 1366 768" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wg1" x1="0%" y1="100%" x2="65%" y2="0%">
        <stop offset="0%"   stop-color="#6B4A0A" stop-opacity="0.92"/>
        <stop offset="42%"  stop-color="#C9A84C" stop-opacity="0.36"/>
        <stop offset="100%" stop-color="#6B4A0A" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="wg2" x1="0%" y1="100%" x2="80%" y2="0%">
        <stop offset="0%"   stop-color="#3A2705" stop-opacity="0.72"/>
        <stop offset="100%" stop-color="#3A2705" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M-150 830 Q120 500 420 410 Q630 345 855 225 Q1075 108 1520 -55" stroke="url(#wg1)" stroke-width="210" fill="none" opacity="0.95"/>
    <path d="M-150 940 Q230 570 545 478 Q770 408 1055 248 Q1255 138 1520 48" stroke="url(#wg2)" stroke-width="72" fill="none" opacity="0.82"/>

  </svg>
</div>
<div class="page">
  <div class="logo-block">
    <img src="assets/logo.png" alt="Arcane Beauty Lounge" class="logo-img">
    <div class="logo-name">ARCANE</div>
    <div class="logo-sub">Beauty Lounge</div>
  </div>
  <div class="btn-row">
    <a href="owner/index.html" class="btn">Owner's Library</a>
    <a href="team/index.html" class="btn">Team Library</a>
  </div>

<style>
  #ai-btn {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.6rem 1.25rem 0.6rem 0.9rem;
    border-radius: var(--radius-pill);
    background: var(--bg-card);
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 0 24px rgba(201,168,76,0.18);
    transition: box-shadow 0.3s, color 0.2s, background 0.2s;
    animation: fadeUp 1.1s cubic-bezier(0.22,1,0.36,1) 0.6s both,
               glowPulse 3.5s ease-in-out 2s infinite;
    white-space: nowrap;
  }
  #ai-btn:hover {
    background: rgba(201,168,76,0.1);
    color: var(--accent-light);
    box-shadow: 0 0 36px rgba(201,168,76,0.32);
    animation: none;
  }
  #ai-btn svg {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
  }
  @media (max-width: 480px) {
    #ai-btn { bottom: 1rem; right: 1rem; font-size: 0.75rem; padding: 0.5rem 1rem 0.5rem 0.75rem; }
  }
</style>

<a id="ai-btn" href="https://gemini.google.com/gem/1RlXmDOdwzw-7aaJwP19j02sb6BsTQVT5?usp=sharing" target="_blank" rel="noopener" aria-label="Open AI Assistant">

    <circle cx="9"  cy="10" r="0.5" fill="currentColor"/>
    <circle cx="12" cy="10" r="0.5" fill="currentColor"/>
    <circle cx="15" cy="10" r="0.5" fill="currentColor"/>
